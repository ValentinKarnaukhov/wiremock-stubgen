openapi: 3.0.3
info:
  title: Composition API
  version: '1.0'

# A second fixture, kept apart from sample-api.yaml on purpose. That one is the source of
# the golden stubs and should not churn; this one exists for the rules the reader has to
# follow when a specification is written the way large real ones are — composed, shared and
# full of things declared somewhere other than where they are used.
#
# Every expectation encoded here was read off models generated by openapi-generator, not
# decided by us: stubs name the classes it writes, so agreeing with it is the whole job.

paths:
  /composed:
    get:
      operationId: getComposed
      tags: [composition]
      parameters:
        # Declared once under components and pointed at from here.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A composition, flattened into one class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composed'
        # Declared once under components and pointed at from here. Large specifications
        # write every error this way, and a reader that stops at the reference sees a
        # response with no body at all.
        '400':
          $ref: '#/components/responses/BadRequest'

  /inline:
    post:
      operationId: postInline
      tags: [composition]
      # Declared once under components and pointed at from here.
      requestBody:
        $ref: '#/components/requestBodies/InlineRequest'
      responses:
        '200':
          description: A body written out in place rather than declared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  origin:
                    type: object
                    properties:
                      host:
                        type: string

  /aliases:
    get:
      operationId: getAliases
      tags: [composition]
      responses:
        '200':
          description: Properties whose schemas are named but shapeless.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aliases'


components:

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string

  requestBodies:
    InlineRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              who:
                type: string

  responses:
    BadRequest:
      description: The shared error every operation points at.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    # allOf produces one flat class holding every member's properties in member order,
    # with no inheritance. A member may be a composition itself.
    Composed:
      allOf:
        - $ref: '#/components/schemas/Identified'
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            extra:
              type: string

    Identified:
      type: object
      properties:
        id:
          type: string
        href:
          type: string

    # A composition whose own member is a composition.
    Timestamped:
      allOf:
        - $ref: '#/components/schemas/Created'

    Created:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time

    Aliases:
      type: object
      properties:
        # A name given to an array or a boolean is an alias, not a class: the generator
        # writes List<Identified> and Boolean into the signature and no such class exists.
        many:
          $ref: '#/components/schemas/IdentifiedList'
        flag:
          $ref: '#/components/schemas/Explored'
        # An allOf wrapping one reference and adding nothing is that reference. This is how
        # a specification hangs a description on a $ref, which JSON Schema forbids directly.
        described:
          allOf:
            - $ref: '#/components/schemas/Identified'
          description: The same Identified, with something said about it here.

    IdentifiedList:
      type: array
      items:
        $ref: '#/components/schemas/Identified'

    Explored:
      type: boolean
      description: A named boolean. No class is generated for it.

    Problem:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string

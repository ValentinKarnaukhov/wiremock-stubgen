openapi: 3.0.3
info:
  title: Composition API
  version: '1.0'

# A second fixture, kept apart from sample-api.yaml: that one is the source of the golden
# stubs and should not churn. This one covers the rules the reader must follow when a
# specification is composed, shared, and declares things away from where they are used.
#
# Every expectation encoded here was read off models generated by openapi-generator, not
# decided by us: stubs name the classes it writes.

paths:
  /composed:
    get:
      operationId: getComposed
      tags: [composition]
      parameters:
        # Declared once under components and pointed at from here.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A composition, flattened into one class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composed'
        # Declared once under components and pointed at from here. A reader that stops
        # at the reference sees a response with no body at all.
        '400':
          $ref: '#/components/responses/BadRequest'

  /grouped:
    get:
      operationId: getGrouped
      tags: [composition]
      # A query parameter given an object schema groups several values under one name in
      # the specification only. openapi-generator sends one query parameter per property
      # and never sends anything called Filter, so that is what a stub must match on.
      parameters:
        - name: Filter
          in: query
          schema:
            $ref: '#/components/schemas/Filter'
        # A composition has no properties of its own, and the generator leaves such a
        # parameter whole rather than expanding it.
        - name: Composed
          in: query
          schema:
            $ref: '#/components/schemas/Composed'
        # Written out in place rather than declared, and expanded just the same.
        - name: Inline
          in: query
          schema:
            type: object
            properties:
              written:
                type: string
        # An object outside the query string is not expanded: it travels whole.
        - name: Header
          in: header
          schema:
            $ref: '#/components/schemas/Filter'
      responses:
        '200':
          description: Accepted.

  /inline:
    post:
      operationId: postInline
      tags: [composition]
      # Declared once under components and pointed at from here.
      requestBody:
        $ref: '#/components/requestBodies/InlineRequest'
      responses:
        '200':
          description: A body written out in place rather than declared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  origin:
                    type: object
                    properties:
                      host:
                        type: string

  /aliases:
    get:
      operationId: getAliases
      tags: [composition]
      responses:
        '200':
          description: Properties whose schemas are named but shapeless.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aliases'

  /enums:
    get:
      operationId: getEnums
      tags: [composition]
      responses:
        '200':
          description: Enums written inside a schema rather than declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enums'

  /readonly:
    get:
      operationId: getReadOnly
      tags: [composition]
      responses:
        '200':
          description: Properties a server sends and a client never submits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadOnlyHolder'

  /alternatives:
    get:
      operationId: getAlternatives
      tags: [composition]
      responses:
        '200':
          description: A oneOf, which openapi-generator flattens like an allOf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEvent'
        'default':
          description: A composition of scalars, which has no shape to describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Any'

  /repeated:
    get:
      operationId: getRepeated
      tags: [composition]
      responses:
        '200':
          description: The same shape written out in more than one place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repeated'
    post:
      operationId: postRepeated
      tags: [composition]
      # A body written out in place, and written the same as a property below. The
      # generator reads the paths before the components, so this is the one that names
      # the class.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Accepted.

components:

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string

  requestBodies:
    InlineRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              who:
                type: string

  responses:
    BadRequest:
      description: The shared error every operation points at.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    # A query parameter written as an object. Its properties are what a client puts on
    # the wire; the name Filter is not sent at all.
    Filter:
      type: object
      properties:
        term:
          type: string
        limit:
          type: integer
          format: int64
        kind:
          type: string
          enum: [FAST, SLOW]

    # allOf produces one flat class holding every member's properties in member order,
    # with no inheritance. A member may be a composition itself.
    Composed:
      allOf:
        - $ref: '#/components/schemas/Identified'
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            extra:
              type: string
            # An inline member has no name of its own, and the generator makes one by
            # inserting AllOf, so this object is ComposedAllOfNote rather than ComposedNote.
            note:
              type: object
              properties:
                text:
                  type: string

    Identified:
      type: object
      properties:
        id:
          type: string
        href:
          type: string

    # A composition whose own member is a composition.
    Timestamped:
      allOf:
        - $ref: '#/components/schemas/Created'

    Created:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        # Written inline here but reached through Timestamped and Composed as well. The
        # generator writes one class, CreatedBy, named after this schema and shared; and
        # a separate copy of the enum nested in every class that ends up with the
        # property. Naming either after the merging schema invents a type nothing writes.
        by:
          type: object
          properties:
            name:
              type: string
        state:
          type: string
          enum: [DRAFT, FINAL]

    # The generator writes one class per shape, not per place. Only the first of these
    # inline objects gets a class; the rest are typed as RepeatedHere. Anything written
    # differently — a description, an order, a required entry — is a shape of its own.
    Repeated:
      type: object
      properties:
        here:
          type: object
          properties:
            city:
              type: string
            zip:
              type: string
        again:
          type: object
          properties:
            city:
              type: string
            zip:
              type: string
        described:
          type: object
          description: The same two properties, said something about.
          properties:
            city:
              type: string
            zip:
              type: string
        reordered:
          type: object
          properties:
            zip:
              type: string
            city:
              type: string
        # Enums are not shared: the generator nests a copy in every class.
        kind:
          type: string
          enum: [FIRST, SECOND]
        elsewhere:
          $ref: '#/components/schemas/RepeatedElsewhere'
        # Written the same as the body of postRepeated, which the generator reaches first.
        fromBody:
          type: object
          properties:
            note:
              type: string

    RepeatedElsewhere:
      type: object
      properties:
        # The same shape as Repeated.here, in a schema of its own, and so the same class.
        somewhere:
          type: object
          properties:
            city:
              type: string
            zip:
              type: string

    Aliases:
      type: object
      properties:
        # A name given to an array or a boolean is an alias, not a class: the generator
        # writes List<Identified> and Boolean into the signature and no such class exists.
        many:
          $ref: '#/components/schemas/IdentifiedList'
        flag:
          $ref: '#/components/schemas/Explored'
        # An allOf wrapping one reference and adding nothing is that reference. This is how
        # a specification hangs a description on a $ref, which JSON Schema forbids directly.
        described:
          allOf:
            - $ref: '#/components/schemas/Identified'
          description: The same Identified, with something said about it here.

    IdentifiedList:
      type: array
      items:
        $ref: '#/components/schemas/Identified'

    Explored:
      type: boolean
      description: A named boolean. No class is generated for it.

    Enums:
      type: object
      properties:
        # Becomes the nested enum Enums.MethodEnum.
        method:
          type: string
          enum: [GET, POST]
        # The suffix is added blind, so this becomes Enums.StatusEnumEnum.
        statusEnum:
          type: string
          enum: [OPEN, CLOSED]
        # The element enum is named after the property, without Inner.
        many:
          type: array
          items:
            type: string
            enum: [P, Q]
        # A declared enum keeps its own name and is not nested.
        named:
          $ref: '#/components/schemas/NamedEnum'

    NamedEnum:
      type: string
      enum: [N1, N2]

    ReadOnlyHolder:
      type: object
      properties:
        plain:
          type: string
        frozen:
          type: string
          readOnly: true
        # readOnly said once, on the schema, and inherited by everything pointing at it.
        viaRef:
          $ref: '#/components/schemas/FrozenAlias'
        # readOnly hung on a composition wrapping a single reference.
        frozenObject:
          allOf:
            - $ref: '#/components/schemas/Identified'
          readOnly: true

    FrozenAlias:
      type: string
      readOnly: true

    Problem:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        # additionalProperties spelled as a boolean rather than a schema. Real problem
        # documents carry a bag like this, and openapi-generator writes it as a map of
        # anything -- while params below, having no additionalProperties at all, is
        # not a map but a bare object.
        errorParams:
          type: object
          additionalProperties: true
        params:
          type: object

    # A oneOf of a single reference with a discriminator. openapi-generator writes an
    # ordinary class holding the member's properties, with ordinary setters.
    BaseEvent:
      oneOf:
        - $ref: '#/components/schemas/ChangeEvent'
      discriminator:
        propertyName: eventType

    ChangeEvent:
      type: object
      properties:
        eventType:
          type: string
        payload:
          type: string

    # Two members that disagree about payload. openapi-generator keeps the last one
    # silently, so merging here has to keep the last one too.
    EitherEvent:
      oneOf:
        - $ref: '#/components/schemas/ChangeEvent'
        - $ref: '#/components/schemas/OtherEvent'

    OtherEvent:
      type: object
      properties:
        payload:
          type: integer
        extra:
          type: string

    # A composition of scalars, which describes no shape. Merging finds no properties in
    # it and it is taken whole — the generator writes the class with no fields at all.
    Any:
      anyOf:
        - type: string
        - type: integer
        - type: boolean

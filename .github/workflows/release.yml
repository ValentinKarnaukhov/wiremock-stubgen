name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version="$(mvn -B -q -Dexpression=project.version -DforceStdout help:evaluate)"
          if [ "$tag_version" != "$pom_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $pom_version" >&2
            exit 1
          fi

      - name: Build, sign, and publish to Maven Central
        run: mvn -B --no-transfer-progress -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found=1; next }
            found && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]:/) { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md

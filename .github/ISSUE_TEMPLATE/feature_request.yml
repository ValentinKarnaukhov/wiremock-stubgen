name: Feature request
description: Something the generator or runtime doesn't do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can't you express today
      description: The stub or plugin behavior you're missing, and the OpenAPI shape it involves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: What the generated stub's API would look like, if you have an idea.
    validations:
      required: false

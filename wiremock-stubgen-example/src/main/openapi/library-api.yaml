openapi: 3.0.3

# The specification the example is built from. Small and plausible, unlike the
# fixture in the fixtures module, yet between its four operations it reaches
# every shape a generated stub can take -- a path parameter, query parameters, a
# response body deep enough to need a builder, a list of objects inside that
# body, an error code with a schema of its own, and a request body to match on.
#
# It is also written the way large specifications are: a shared error response
# referred to from several operations, a resource composed with allOf, a status
# enum written inside the schema that uses it, a property only the server ever
# sends, and a body written out in place instead of being declared.

info:
  title: Library API
  version: 1.0.0
  description: Borrowing books from a library.

servers:
  - url: https://library.example.com

paths:
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [ books ]
      summary: One book by its identifier.
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        # Neither query nor header. WireMock matches cookies through a call of its
        # own, so a cookie parameter is not a header parameter under another name.
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        200:
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        # Written once under components and pointed at from every operation that
        # can fail this way.
        404:
          $ref: '#/components/responses/NotFound'
        # The catch-all for everything not listed. It names no status, so the stub
        # cannot invent one and asks the caller for it.
        default:
          description: Anything else that went wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /books:
    get:
      operationId: searchBooks
      tags: [ books ]
      summary: Books matching a search.
      parameters:
        - name: author
          in: query
          schema:
            type: string
        - name: availableOnly
          in: query
          schema:
            type: boolean
      responses:
        200:
          description: The books that matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'

  /loans:
    post:
      operationId: borrowBook
      tags: [ loans ]
      summary: Borrow a book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        201:
          description: The loan that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        409:
          $ref: '#/components/responses/Conflict'

  /loans/{loanId}:
    delete:
      operationId: returnLoan
      tags: [ loans ]
      summary: Give a borrowed book back.
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: What the return cost.
          # Written out here rather than declared. The model generator invents a
          # class for it and names it after where it sits, and the stub has to
          # use that same name or it refers to nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  returnedAt:
                    type: string
                  lateFee:
                    type: object
                    properties:
                      amount:
                        type: number
                      currency:
                        type: string
        404:
          $ref: '#/components/responses/NotFound'

  /events:
    get:
      operationId: listEvents
      tags: [ loans ]
      summary: What has happened to a loan.
      responses:
        200:
          description: A oneOf, which the model generator flattens into one class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanEvent'

  /notifications:
    get:
      operationId: listNotifications
      tags: [ loans ]
      summary: How a borrower was told about something.
      responses:
        200:
          description: A oneOf naming two alternatives, which the two readings disagree about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

components:

  responses:

    NotFound:
      description: Nothing here by that identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: The book is already on loan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          $ref: '#/components/schemas/Author'
        tags:
          type: array
          items:
            type: string
        # An enum written here rather than declared. The model generator nests it
        # inside Book, so the stub says Book.StatusEnum.
        status:
          type: string
          enum: [ AVAILABLE, ON_LOAN, LOST ]
        # The library sets this; nobody submits it. A read-only property gets a
        # getter and no setter, and a stub playing the server still has to be
        # able to send one.
        addedAt:
          type: string
          readOnly: true
        # Formats the model generator turns into types of their own rather than
        # String, so an accessor for one has to name UUID and LocalDate.
        isbn:
          type: string
          format: uuid
        publishedOn:
          type: string
          format: date
        # Not a string either, though it looks like one. The awkward part is that
        # its neighbours below -- url, email -- are formats the generator knows
        # and still writes as String, so the rule is not "any format is a type".
        coverUrl:
          type: string
          format: uri
        publisherSite:
          type: string
          format: url
        # No properties, only a rule about the ones that turn up. The model
        # generator writes a Map, which has no setters to reach into.
        ratings:
          type: object
          additionalProperties:
            type: integer
        # additionalProperties written as a boolean rather than a schema. It is
        # still a map, of anything; the neighbour below has no additionalProperties
        # at all and so is not a map but a bare Object.
        metadata:
          type: object
          additionalProperties: true
        annotation:
          type: object
        # A list inside a list. There is no position to open, so the whole thing
        # is set at once.
        chapters:
          type: array
          items:
            type: array
            items:
              type: string

    Author:
      type: object
      properties:
        name:
          type: string
        country:
          type: string

    BookPage:
      type: object
      properties:
        total:
          type: integer
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'

    LoanRequest:
      type: object
      required: [ bookId ]
      properties:
        bookId:
          type: string
        borrower:
          $ref: '#/components/schemas/Borrower'
        days:
          type: integer
        # A list of numbers, matched by asking whether any element equals the value.
        editions:
          type: array
          items:
            type: integer
        # A wire name is not an identifier and need not look like one. A dot in it is
        # ordinary JSON and must not be read as a step down the path.
        loan.reference:
          type: string
        # Matched through a filter, where the value is part of the expression rather
        # than a pattern beside it, so a quote in it has to be escaped.
        notes:
          type: array
          items:
            type: string

    Borrower:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    # Composed rather than written out. openapi-generator flattens this into one
    # class holding every member's properties -- there is no inheritance in the
    # models -- so the stub offers one flat set of accessors over both.
    Loan:
      allOf:
        - $ref: '#/components/schemas/Reference'
        - type: object
          properties:
            book:
              $ref: '#/components/schemas/Book'
            dueDate:
              type: string
            # A perfectly ordinary word that also names a method every Java class
            # inherits. A nested object at the root of a body opens a scope, and the
            # accessor that opens it takes no arguments, so calling it notify() would
            # clash with the final Object.notify() and the stub would not compile.
            notify:
              type: object
              properties:
                byEmail:
                  type: boolean
                bySms:
                  type: boolean

    Reference:
      type: object
      properties:
        id:
          type: string
        href:
          type: string

    # A oneOf with a discriminator. The model generator writes an ordinary class
    # holding the member's properties, so the stub offers accessors into it
    # exactly as it would for an allOf.
    LoanEvent:
      oneOf:
        - $ref: '#/components/schemas/LoanReturnedEvent'
      discriminator:
        propertyName: eventType

    LoanReturnedEvent:
      type: object
      properties:
        eventType:
          type: string
        loanId:
          type: string
        borrower:
          $ref: '#/components/schemas/Borrower'

    # Two alternatives, not one. Under the merging reading the model generator
    # writes a single class holding both members' properties and the stub reaches
    # into it; under useOneOfInterfaces it writes an empty interface instead,
    # which has nothing to set, and the opaque reading takes the body whole.
    Notification:
      oneOf:
        - $ref: '#/components/schemas/EmailNotification'
        - $ref: '#/components/schemas/SmsNotification'

    EmailNotification:
      type: object
      properties:
        address:
          type: string
        subject:
          type: string

    SmsNotification:
      type: object
      properties:
        number:
          type: string

    Problem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

openapi: 3.0.0
info:
  description: Swagger file for testing stub generation
  version: 1.0.0
  title: wiremock-stub-generator test swagger
servers:
  - url: http://localhost:8080
tags:
  - name: get-by-parameters-in-query
  - name: get-by-parameters-in-path
  - name: get-by-parameters-in-header
  - name: get-by-parameters-reserved-names
  - name: post-by-request-body-primitive
  - name: post-by-request-body-composite
  - name: post-by-request-body-primitive-list
  - name: post-by-request-body-composite-list
  - name: get-response-primitive
  - name: get-response-composite
  - name: get-response-primitive-list
  - name: get-response-composite-list
  - name: get-response-errors
  - name: get-response-recursive
  - name: get-response-reserved-names
  - name: multiple-operations
paths:
  /get/parameters/in-query:
    get:
      tags:
        - get-by-parameters-in-query
      operationId: getByInQueryParameters
      parameters:
        - name: stringParam
          in: query
          required: false
          schema:
            type: string
        - name: integerParam
          in: query
          required: false
          schema:
            type: integer
        - name: longParam
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: booleanParam
          in: query
          required: false
          schema:
            type: boolean
        - name: floatParam
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: doubleParam
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: enumParam
          in: query
          required: false
          schema:
            type: string
            enum:
            - EnumValue1
            - EnumValue2
      responses:
        200:
          description: OK
  /get/parameters/in-path/{stringParam}/{longParam}:
    get:
      tags:
        - get-by-parameters-in-path
      operationId: getByInPathParameters
      parameters:
        - name: stringParam
          in: path
          required: true
          schema:
            type: string
        - name: longParam
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK
  /get/parameters/in-header:
    get:
      tags:
        - get-by-parameters-in-header
      operationId: getByInHeaderParameters
      parameters:
        - name: stringHeader
          in: header
          required: true
          schema:
            type: string
        - name: booleanHeader
          in: header
          required: false
          schema:
            type: boolean
        - name: X-Dashed-Header
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
  /get/parameters/reserved-names:
    get:
      tags:
        - get-by-parameters-reserved-names
      operationId: getByReservedNamesParameters
      parameters:
        - name: class
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: customize
          in: query
          required: false
          schema:
            type: string
        - name: mock
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
  /post/request-body/primitive:
    post:
      tags:
        - post-by-request-body-primitive
      operationId: postByRequestBodyPrimitive
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        200:
          description: OK
  /post/request-body/composite:
    post:
      tags:
        - post-by-request-body-composite
      operationId: postByRequestBodyComposite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeBody'
      responses:
        200:
          description: OK
  /post/request-body/primitive/list:
    post:
      tags:
        - post-by-request-body-primitive-list
      operationId: postByRequestBodyPrimitiveList
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        200:
          description: OK
  /post/request-body/composite/list:
    post:
      tags:
        - post-by-request-body-composite-list
      operationId: postByRequestBodyCompositeList
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CompositeBody'
      responses:
        200:
          description: OK
  /get/response/primitive:
    get:
      tags:
        - get-response-primitive
      operationId: getResponsePrimitive
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
          description: primitive
  /get/response/composite:
    get:
      tags:
        - get-response-composite
      operationId: getResponseComposite
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeBody'
          description: composite
  /get/response/primitive/list:
    get:
      tags:
        - get-response-primitive-list
      operationId: getResponsePrimitiveList
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: primitiveList
  /get/response/composite/list:
    get:
      tags:
        - get-response-composite-list
      operationId: getResponseCompositeList
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompositeBody'
          description: compositeList
  /get/response/errors:
    get:
      tags:
        - get-response-errors
      operationId: getResponseErrors
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeBody'
          description: composite
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: error
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: error
  /get/response/recursive:
    get:
      tags:
        - get-response-recursive
      operationId: getResponseRecursive
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursiveBody'
          description: recursive
  /get/response/reserved-names:
    get:
      tags:
        - get-response-reserved-names
      operationId: getResponseReservedNames
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedNamesBody'
          description: properties whose names collide with the runtime base class
  /get/multiple-operations/first:
    get:
      tags:
        - multiple-operations
      operationId: getMultipleOperationsFirst
      responses:
        200:
          description: OK
  /get/multiple-operations/second:
    get:
      tags:
        - multiple-operations
      operationId: getMultipleOperationsSecond
      responses:
        200:
          description: OK
components:
  schemas:
    CompositeBody:
      type: object
      properties:
        primitive:
          type: string
        composite:
          $ref: "#/components/schemas/CompositeField"
        primitiveList:
          type: array
          items:
            type: string
        compositeList:
          type: array
          items:
            $ref: "#/components/schemas/CompositeField"
    CompositeField:
      properties:
        innerField:
          type: string
        deepField:
          $ref: "#/components/schemas/CompositeDeepField"
    CompositeDeepField:
      properties:
        deepestField:
          type: string
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    RecursiveBody:
      type: object
      properties:
        primitive:
          type: string
        recursive:
          $ref: "#/components/schemas/RecursiveBody"
        recursiveList:
          type: array
          items:
            $ref: "#/components/schemas/RecursiveBody"
        recursiveField:
          $ref: "#/components/schemas/RecursiveField"
    RecursiveField:
      properties:
        innerField:
          type: string
        recursive:
          $ref: "#/components/schemas/RecursiveBody"
    # Properties named after methods the generated scope inherits from the runtime.
    # Reserved names were previously covered only as operation parameters, which stopped
    # being the dangerous case once bodies moved off the stub and onto builders.
    ReservedNamesBody:
      type: object
      properties:
        # One argument: a legal overload of the final exit(), so this compiles and only
        # reads badly.
        exit:
          type: string
        mock:
          type: string
        # Zero arguments: identical signature to the final exit(), a compile error.
        addNew:
          type: array
          items:
            $ref: "#/components/schemas/ReservedNamesItem"
        # Flattening rescues the same name by prefixing it: safeExit, not exit.
        safe:
          $ref: "#/components/schemas/ReservedNamesItem"
        x-dashed-property:
          type: string
    ReservedNamesItem:
      properties:
        exit:
          type: string
        innerField:
          type: string
